services:
  sign-classifier:
    build: .
    image: rtsc-app
    container_name: sign-classifier
    ports:
      - "8501:8501"
    volumes:
      # Example images for the "class sample" panel; optional.
      - ./data/processed:/app/data/processed:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
